[project]
name = "poker-arena"
version = "0.1.0"
description = "Poker Arena — motor de Texas Hold'em No-Limit + bots de IA"
requires-python = ">=3.11"
dependencies = ["treys>=0.1.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poker_arena"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # treys não tem stubs
warn_redundant_casts = true
warn_unused_ignores = true
disallow_incomplete_defs = true
files = ["poker_arena"]
