[project]
name = "poker-arena"
version = "0.2.0"
description = "Poker Arena — motor de Texas Hold'em No-Limit + bots de IA"
requires-python = ">=3.11"
dependencies = [
    "treys>=0.1.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Uvicorn's minimal install has no WebSocket protocol implementation.
    # Keep the runtime capability explicit and bounded to one compatible major.
    "websockets>=16.0,<17",
    "onnxruntime>=1.27.0",
    "onnx>=1.22.0",
    "numpy>=2",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poker_arena"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ""
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# Ruff's formatter intentionally does not split long prose/URLs/string literals.
# Keep semantic E-rules while delegating line layout to the formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Assertions, synthetic credentials and seeded PRNGs are test fixtures; production code
# receives none of these waivers. Exec/subprocess/network findings still require line-level proof.
"tests/**/*.py" = ["S101", "S105", "S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # treys não tem stubs
warn_redundant_casts = true
warn_unused_ignores = true
disallow_incomplete_defs = true
files = ["poker_arena"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "pokerkit>=0.6",
    "hypothesis>=6.135",
    "pip-audit>=2.9",
]
