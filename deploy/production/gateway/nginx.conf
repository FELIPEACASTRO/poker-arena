pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Never log query strings: OIDC callbacks carry a one-time code in the query.
    log_format edge '$remote_addr - [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent request_id=$request_id';
    access_log /dev/stdout edge;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=application_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    client_body_temp_path /tmp/nginx-cache/client;
    proxy_temp_path /tmp/nginx-cache/proxy;
    fastcgi_temp_path /tmp/nginx-cache/fastcgi;
    uwsgi_temp_path /tmp/nginx-cache/uwsgi;
    scgi_temp_path /tmp/nginx-cache/scgi;

    include /tmp/nginx-conf/*.conf;
}
