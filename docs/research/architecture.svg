<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura de pesquisa e promoção baseada em evidências</title>
  <desc id="desc">Fluxo de dados governados para trilhas independentes de estratégia e visão, seguido por calibração, avaliação independente e promoção imutável.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#10243c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#80d8ff"/>
    </marker>
    <style>
      .h1{font:700 28px system-ui,sans-serif;fill:#f4f8ff}.h2{font:700 18px system-ui,sans-serif;fill:#fff}.txt{font:14px system-ui,sans-serif;fill:#dbeafe}.small{font:12px system-ui,sans-serif;fill:#cbd5e1}.box{stroke-width:2;rx:16;filter:url(#shadow)}.arrow{stroke:#80d8ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#fbbf24;stroke-width:2;stroke-dasharray:7 6;fill:none}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="700" y="48" text-anchor="middle" class="h1">Arquitetura proposta: evidência antes de promoção</text>
  <text x="700" y="76" text-anchor="middle" class="small">Poker Arena · trilhas separadas de estratégia e visão · versão 2026-07-17</text>

  <rect x="40" y="115" width="265" height="200" class="box" fill="#17365d" stroke="#60a5fa"/>
  <text x="172" y="146" text-anchor="middle" class="h2">Fontes candidatas</text>
  <text x="62" y="178" class="txt">• PHH v3 / Pluribus / ACPC</text>
  <text x="62" y="204" class="txt">• capturas reais autorizadas</text>
  <text x="62" y="230" class="txt">• gerador sintético versionado</text>
  <text x="62" y="256" class="txt">• PokerBench / Kaggle OOD</text>
  <text x="62" y="282" class="txt">• modelos oficiais com licença</text>

  <rect x="375" y="115" width="285" height="200" class="box" fill="#164e63" stroke="#22d3ee"/>
  <text x="517" y="146" text-anchor="middle" class="h2">Manifesto e quarentena</text>
  <text x="397" y="178" class="txt">• commit, versão e SHA-256</text>
  <text x="397" y="204" class="txt">• licença e proveniência</text>
  <text x="397" y="230" class="txt">• dedup / grupo / split</text>
  <text x="397" y="256" class="txt">• schema e cobertura</text>
  <text x="397" y="282" class="txt">• falha fechada, sem segredo</text>
  <path d="M305 215 H365" class="arrow"/>

  <rect x="735" y="105" width="625" height="220" class="box" fill="#3f1d49" stroke="#e879f9"/>
  <text x="1048" y="138" text-anchor="middle" class="h2">Bloqueios antes do treino</text>
  <text x="765" y="174" class="txt">RF100/mirrors com schema visualmente corrompido</text>
  <text x="765" y="202" class="txt">revisões mutáveis, parser silencioso ou artefato sem card</text>
  <text x="765" y="230" class="txt">ação humana/LLM tratada como rótulo GTO</text>
  <text x="765" y="258" class="txt">split por frame em vez de cliente/sessão/deck/jogador</text>
  <text x="765" y="286" class="txt">publicação automática ou checkpoint com nome divergente</text>
  <path d="M660 215 H725" class="dash"/>

  <rect x="70" y="390" width="550" height="235" class="box" fill="#123b32" stroke="#34d399"/>
  <text x="345" y="424" text-anchor="middle" class="h2">Trilha A · estratégia</text>
  <text x="98" y="462" class="txt">1. estado observável sem colisões + histórico de apostas</text>
  <text x="98" y="491" class="txt">2. PPO controle; league/current-policy; PSRO/NFSP challengers</text>
  <text x="98" y="520" class="txt">3. OpenSpiel/CFR apenas em jogos formalmente adaptados</text>
  <text x="98" y="549" class="txt">4. matriz cross-play, rotação, duplicate deals, múltiplas seeds</text>
  <text x="98" y="578" class="txt">5. 30 blocos + IC/FWER/MDE; AIVAT só na trilha formal</text>

  <rect x="780" y="390" width="550" height="235" class="box" fill="#3b2f16" stroke="#fbbf24"/>
  <text x="1055" y="424" text-anchor="middle" class="h2">Trilha B · percepção visual</text>
  <text x="808" y="462" class="txt">1. detector: YOLO11n baseline × D-FINE-N × RF-DETR Nano</text>
  <text x="808" y="491" class="txt">2. crop/retificação + classificador rank/suit desacoplado</text>
  <text x="808" y="520" class="txt">3. OCR PP-OCRv4 × v6 tiny/small/medium em ROIs reais</text>
  <text x="808" y="549" class="txt">4. calibração por campo, abstenção e consenso temporal</text>
  <text x="808" y="578" class="txt">5. exact-state/FAR/coverage/AURC/ECE + p50/p95/RSS</text>

  <path d="M517 315 V350 H345 V380" class="arrow"/>
  <path d="M517 315 V350 H1055 V380" class="arrow"/>

  <rect x="305" y="700" width="790" height="130" class="box" fill="#1e293b" stroke="#a5b4fc"/>
  <text x="700" y="735" text-anchor="middle" class="h2">Gate comum, independente e pré-registrado</text>
  <text x="335" y="769" class="txt">pré-registro • MDE • OOD real • IC simultâneo • licença • latência/RAM • paridade ONNX</text>
  <text x="335" y="799" class="txt">PASS → candidate/&lt;hash&gt; → manifesto imutável → promoção atômica → runtime com abstenção</text>
  <path d="M345 625 V690" class="arrow"/>
  <path d="M1055 625 V690" class="arrow"/>

  <rect x="1135" y="705" width="225" height="120" class="box" fill="#511827" stroke="#fb7185"/>
  <text x="1247" y="739" text-anchor="middle" class="h2">FAIL</text>
  <text x="1158" y="773" class="txt">quarentena + reason code</text>
  <text x="1158" y="800" class="txt">sem sobrescrever canônico</text>
  <path d="M1095 765 H1125" class="dash"/>
</svg>
