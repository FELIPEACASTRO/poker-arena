<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline auditável da varredura de 156 plataformas para a Poker Arena</title>
  <desc id="desc">Fluxo do inventário e acesso, passando por buscas temáticas e triagem de evidências, até decisões experimentais e gates de promoção.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 28px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b5563; }
      .box-title { font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #111827; }
      .body { font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #253046; }
      .small { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4b5563; }
      .metric { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .tag { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .03em; }
      .line { fill: none; stroke: #4b5563; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="70" y="58" class="title">Da descoberta à promoção: evidência antes de compute</text>
  <text x="70" y="86" class="subtitle">Snapshot 2026-07-17 · todos os URLs do anexo inventariados · bloqueios preservados · nenhuma credencial registrada</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="135" width="270" height="205" rx="18" fill="#e8f4fb" stroke="#0072b2" stroke-width="2"/>
  </g>
  <rect x="92" y="154" width="92" height="25" rx="12" fill="#0072b2"/>
  <text x="138" y="171" text-anchor="middle" class="tag" fill="#fff">UNIVERSO</text>
  <text x="92" y="210" class="metric" fill="#0072b2">156 plataformas</text>
  <text x="92" y="237" class="body">12 seções do catálogo</text>
  <text x="92" y="263" class="body">SHA-256 do anexo fixado</text>
  <text x="92" y="289" class="body">ID estável por URL</text>
  <text x="92" y="316" class="small">Cobertura testada: 54 + 55 + 47 = 156</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="405" y="135" width="300" height="205" rx="18" fill="#fff6df" stroke="#e69f00" stroke-width="2"/>
  </g>
  <rect x="427" y="154" width="108" height="25" rx="12" fill="#e69f00"/>
  <text x="481" y="171" text-anchor="middle" class="tag" fill="#111827">ACESSO</text>
  <text x="427" y="207" class="box-title">Probe raso, sem contorno</text>
  <text x="427" y="239" class="metric" fill="#8a5a00">114</text>
  <text x="477" y="239" class="body">alcançáveis</text>
  <text x="427" y="270" class="metric" fill="#d55e00">30</text>
  <text x="468" y="270" class="body">erros HTTP</text>
  <text x="427" y="301" class="metric" fill="#6b7280">12</text>
  <text x="468" y="301" class="body">erros de rede</text>
  <text x="427" y="324" class="small">34 redirecionamentos registrados</text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="770" y="135" width="300" height="205" rx="18" fill="#e7f7f1" stroke="#009e73" stroke-width="2"/>
  </g>
  <rect x="792" y="154" width="100" height="25" rx="12" fill="#009e73"/>
  <text x="842" y="171" text-anchor="middle" class="tag" fill="#fff">BUSCAS</text>
  <text x="792" y="207" class="box-title">Sete famílias temáticas</text>
  <text x="792" y="237" class="body">Poker · visão/OCR · datasets</text>
  <text x="792" y="263" class="body">Self-play · opponent modelling</text>
  <text x="792" y="289" class="body">Calibração · métricas/abstenção</text>
  <text x="792" y="316" class="small">Site-specific + APIs/índices oficiais</text>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="1135" y="135" width="200" height="205" rx="18" fill="#f6eefa" stroke="#cc79a7" stroke-width="2"/>
  </g>
  <rect x="1157" y="154" width="96" height="25" rx="12" fill="#cc79a7"/>
  <text x="1205" y="171" text-anchor="middle" class="tag" fill="#111827">TRIAGEM</text>
  <text x="1157" y="207" class="box-title">Quatro níveis</text>
  <text x="1157" y="239" class="body">Fonte primária</text>
  <text x="1157" y="265" class="body">Metadado/índice</text>
  <text x="1157" y="291" class="body">Hipótese não reproduzida</text>
  <text x="1157" y="317" class="body">Bloqueio / inconclusivo</text>

  <path class="line" d="M340 237 H395"/>
  <path class="line" d="M705 237 H760"/>
  <path class="line" d="M1070 237 H1125"/>

  <!-- Regional audit -->
  <g filter="url(#shadow)">
    <rect x="70" y="400" width="560" height="190" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="94" y="435" class="box-title">Recorte regional solicitado</text>
  <rect x="94" y="455" width="82" height="24" rx="12" fill="#0072b2"/>
  <text x="135" y="472" text-anchor="middle" class="tag" fill="#fff">ÁSIA</text>
  <text x="190" y="472" class="body">Jxiv · ChinaXiv · Sciencepaper · IndiaRxiv</text>
  <text x="190" y="495" class="body">BodoArXiv · RINarXiv · CrossAsia</text>
  <rect x="94" y="515" width="82" height="24" rx="12" fill="#d55e00"/>
  <text x="135" y="532" text-anchor="middle" class="tag" fill="#fff">RÚSSIA</text>
  <text x="190" y="532" class="body">Preprints.ru · 502 no snapshot; inconclusivo</text>
  <rect x="94" y="548" width="82" height="24" rx="12" fill="#009e73"/>
  <text x="135" y="565" text-anchor="middle" class="tag" fill="#fff">CANADÁ</text>
  <text x="190" y="565" class="body">MNI Open Research · fonte metodológica</text>

  <!-- Candidate decisions -->
  <g filter="url(#shadow)">
    <rect x="690" y="400" width="645" height="190" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="714" y="435" class="box-title">Decisão científica, não ranking por popularidade</text>
  <rect x="714" y="455" width="116" height="28" rx="14" fill="#009e73"/>
  <text x="772" y="474" text-anchor="middle" class="tag" fill="#fff">ADOTAR JÁ</text>
  <text x="846" y="474" class="body">receipts, splits agrupados, PPO controle, abstenção</text>
  <rect x="714" y="495" width="116" height="28" rx="14" fill="#0072b2"/>
  <text x="772" y="514" text-anchor="middle" class="tag" fill="#fff">EXPERIMENTO</text>
  <text x="846" y="514" class="body">OpenSpiel 2.0, StratFormer, PP-OCRv6, D-FINE/RF-DETR</text>
  <rect x="714" y="535" width="116" height="28" rx="14" fill="#e69f00"/>
  <text x="772" y="554" text-anchor="middle" class="tag" fill="#111827">QUARENTENA</text>
  <text x="846" y="554" class="body">MRPH, pesos sem hash/licença, claims sem reprodução</text>

  <path class="line" d="M1235 340 V372 H1012 V390"/>

  <!-- Promotion gates -->
  <g filter="url(#shadow)">
    <rect x="70" y="650" width="1265" height="175" rx="18" fill="#fff4ef" stroke="#d55e00" stroke-width="2"/>
  </g>
  <rect x="94" y="670" width="150" height="27" rx="13" fill="#d55e00"/>
  <text x="169" y="688" text-anchor="middle" class="tag" fill="#fff">GATES DE PROMOÇÃO</text>
  <text x="94" y="730" class="box-title">Visão</text>
  <text x="94" y="758" class="body">exact-state · FAR · AURC · ECE/NLL/Brier · OOD por cliente/sessão · p95/RSS</text>
  <text x="94" y="794" class="box-title">Estratégia</text>
  <text x="214" y="794" class="body">cross-play pareado · assentos/deals · IC simultâneo · pior matchup · exploitability só em jogo formal</text>
  <text x="790" y="730" class="box-title">Artefatos</text>
  <text x="790" y="758" class="body">commit/release/peso + SHA-256 · licença exata · manifesto imutável · rollback</text>
  <text x="790" y="794" class="box-title">Ética</text>
  <text x="852" y="794" class="body">simulador educacional local; sem bot para jogo com dinheiro real</text>

  <path class="line" d="M1012 590 V640"/>
  <text x="70" y="866" class="small">Figura autoral gerada para esta revisão. Cores distinguem etapas; todos os significados também estão expressos em texto.</text>
</svg>
